<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg-1: #0b1433;
    --bg-2: #03050f;
    --ice: #7df9ff;
    --ink: #eaf6ff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 42%, var(--bg-1) 0%, var(--bg-2) 72%);
    overflow: hidden; cursor: pointer;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  h1 {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 13vh);
    margin: 0; padding-top: 1.6rem; text-align: center;
    font-family: "Jost", "Futura", "Century Gothic", "Trebuchet MS", sans-serif;
    font-weight: 300; text-transform: uppercase;
    font-size: clamp(1.35rem, 6vw, 3.2rem); line-height: 1.2;
    color: var(--ink);
    text-shadow: 0 0 22px rgba(125, 249, 255, .45);
    opacity: 0; letter-spacing: .7em; text-indent: .7em;
    transition: opacity 1.6s ease, letter-spacing 2.4s cubic-bezier(.2,.7,.2,1), text-indent 2.4s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  h1::before {
    content: ""; position: absolute; top: 0; left: 50%;
    width: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--ice), transparent);
    transform: translateX(-50%); transition: width 1.8s cubic-bezier(.2,.7,.2,1);
  }
  h1.show { opacity: 1; letter-spacing: .3em; text-indent: .3em; }
  h1.show::before { width: min(70vw, 26rem); }
  @media (prefers-reduced-motion: reduce) { h1, h1::before { transition-duration: .01s; } }
  canvas#c { transition: opacity .8s ease; }
  #go, #chap, #hint { font-family: "Jost", "Futura", "Century Gothic", sans-serif; color: var(--ink); }
  #go {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 3.5vh);
    font-size: .85rem; font-weight: 400; letter-spacing: .4em; text-indent: .4em; text-transform: uppercase;
    background: rgba(125,249,255,.06); border: 1px solid rgba(125,249,255,.6);
    padding: 1rem 2.2rem; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease .8s, background .3s, box-shadow .3s;
  }
  #go.show { opacity: 1; pointer-events: auto; }
  #go:hover { background: rgba(125,249,255,.2); box-shadow: 0 0 28px rgba(125,249,255,.4); }
  #gl { z-index: 1; opacity: 0; transition: opacity 1.5s ease .4s; pointer-events: none; }
  #story { position: fixed; inset: 0; z-index: 2; overflow-y: auto; display: none; scrollbar-width: none; }
  #story::-webkit-scrollbar { display: none; }
  #spacer { height: 1100vh; }
  #chap, #hint { position: fixed; left: 0; right: 0; margin: 0; text-align: center; z-index: 3; pointer-events: none; opacity: 0; text-shadow: 0 0 22px rgba(125,249,255,.45); }
  #chap { bottom: calc(env(safe-area-inset-bottom, 0px) + 11vh); font-size: clamp(1.25rem, 5.2vw, 2.4rem); font-weight: 300; letter-spacing: .05em; padding: 0 1.5rem; box-sizing: border-box; }
  #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 4vh); font-size: .75rem; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase; transition: opacity 1s; }
  body.on #story { display: block; }
  body.on #gl { opacity: 1; }
  body.on #c, body.on h1, body.on #go { opacity: 0 !important; pointer-events: none !important; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<h1 id="msg">Happy Anniversary</h1>
<button id="go" type="button">Continue</button>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="story"><div id="spacer"></div></div>
<p id="chap"></p><p id="hint">Scroll</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), msg = document.getElementById('msg');
  var W, H, S, cx, cy, dpr;
  var K = 44, START = 0.9, GAP = 0.11, DUR = 1.1, TWIST = 0.15;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = performance.now(), shown = false;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W * 0.86 / 32, H * 0.5 / 28);
    cx = W / 2; cy = H * 0.42;
  }
  addEventListener('resize', resize); resize();

  function hp(t, s) {
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [cx + x * s, cy - (y + 3) * s];
  }
  function ease(p) { return 1 - Math.pow(1 - p, 3); }
  function hue(k) { return 185 + (k / K) * 85; }          // ice cyan -> violet
  function poly(n, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var a = rot + i / n * Math.PI * 2, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
  function diamond(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y);
    ctx.closePath(); ctx.fill();
  }

  function frame(now) {
    if (gone) return;
    var T = reduce ? 99 : (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    var beat = 1 + 0.09 * Math.pow(Math.sin(T * 3.2), 8) + 0.03 * Math.sin(T * 3.2);
    var s0 = S * 0.17 * beat, end = START + K * GAP + DUR, allDone = T > end;

    // background geometry: slowly counter-rotating hexagon and square
    var fade = Math.min(1, T / 2.5);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(125,249,255,' + (0.13 * fade) + ')';
    poly(6, S * 17.5, T * 0.06 - Math.PI / 2);
    ctx.strokeStyle = 'rgba(164,130,255,' + (0.13 * fade) + ')';
    poly(4, S * 13, -T * 0.08 + Math.PI / 4);

    ctx.globalCompositeOperation = 'lighter';
    var landed = { '-1': [], '1': [] };

    for (var k = 0; k < K; k++) {
      var p = Math.max(0, Math.min(1, (T - (START + k * GAP)) / DUR));
      if (p <= 0) continue;
      var e = ease(p), h = hue(k);
      for (var side = -1; side <= 1; side += 2) {
        var t = Math.PI + side * (k + 0.5) / K * Math.PI;
        var a = hp(t, s0), b = hp(t + side * TWIST, S);
        var tx = a[0] + (b[0] - a[0]) * e, ty = a[1] + (b[1] - a[1]) * e;
        ctx.strokeStyle = 'hsla(' + h + ',95%,66%,.55)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(tx, ty); ctx.stroke();
        if (p < 1) {
          ctx.fillStyle = 'hsl(' + h + ',100%,85%)';
          ctx.shadowColor = 'hsl(' + h + ',100%,65%)'; ctx.shadowBlur = 12;
          diamond(tx, ty, 3.2); ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = 'hsla(' + h + ',100%,80%,.95)';
          diamond(b[0], b[1], 2.4);
          landed[side].push(b);
        }
      }
    }

    // angular outline of the big heart, joined edge by edge as strings land
    ctx.lineWidth = 1.2;
    [-1, 1].forEach(function (side) {
      var pts = landed[side];
      if (pts.length < 2) return;
      ctx.strokeStyle = 'rgba(190,240,255,.55)';
      ctx.beginPath();
      pts.forEach(function (q, i) { i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
      ctx.stroke();
    });

    ctx.globalCompositeOperation = 'source-over';

    // faceted centre heart
    var N = 20, c0 = [cx, cy - 3 * s0], pts = [];
    for (var i = 0; i < N; i++) pts.push(hp(i / N * Math.PI * 2 + Math.PI, s0));
    ctx.shadowColor = 'rgba(90,200,255,.9)'; ctx.shadowBlur = 26;
    ctx.fillStyle = '#2f7bff';
    ctx.beginPath();
    pts.forEach(function (q, i) { i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    for (var j = 0; j < N; j++) {
      var q1 = pts[j], q2 = pts[(j + 1) % N];
      ctx.fillStyle = j % 2 ? 'rgba(125,249,255,.55)' : 'rgba(255,255,255,.14)';
      ctx.beginPath(); ctx.moveTo(c0[0], c0[1]); ctx.lineTo(q1[0], q1[1]); ctx.lineTo(q2[0], q2[1]); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(234,246,255,.8)'; ctx.lineWidth = 1;
    ctx.beginPath();
    pts.forEach(function (q, i) { i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath(); ctx.stroke();

    if (allDone && !shown) { shown = true; msg.classList.add('show'); go.classList.add('show'); }
    requestAnimationFrame(frame);
  }

  var gone = false, go = document.getElementById('go');
  go.addEventListener('click', startStory);

  function startStory() {
    gone = true; go.classList.remove('show'); document.body.classList.add('on');
    var story = document.getElementById('story'), chap = document.getElementById('chap'), hint = document.getElementById('hint');
    var L = ['Two little hearts…', 'found each other,', 'and haven’t stopped dancing since.', 'Every day with you is my favourite day.', 'I love you, always.', 'Happy Anniversary, my love.'];
    L = ['Once upon a time…', 'two little hearts found each other.', 'They danced through every season,', 'every laugh, every sleepy morning,', 'every little adventure.', 'And now they never let go.', 'Happy Anniversary, my love.'];
    if (!window.THREE) { chap.textContent = L[6]; chap.style.opacity = 1; return; }
    var sm = function (x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

    var R = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true });
    R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    var sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 100), world = new THREE.Group(), camZ = 9;
    sc.add(world); world.position.y = .7;
    sc.add(new THREE.AmbientLight(0xffffff, .75));
    var dl = new THREE.DirectionalLight(0xffffff, .9); dl.position.set(3, 5, 6); sc.add(dl);
    var pl = new THREE.PointLight(0x9a7bff, .8, 30); pl.position.set(-5, -2, 4); sc.add(pl);
    function size() {
      R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight;
      camZ = Math.max(9, 10.5 / cam.aspect); cam.updateProjectionMatrix();
    }
    addEventListener('resize', size); size();

    // faceted 3D heart + cute face
    var shp = new THREE.Shape(), i, t;
    for (i = 0; i <= 28; i++) {
      t = i / 28 * Math.PI * 2;
      var hx = 1.6 * Math.pow(Math.sin(t), 3), hy = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 10;
      i ? shp.lineTo(hx, hy) : shp.moveTo(hx, hy);
    }
    var geo = new THREE.ExtrudeGeometry(shp, { depth: .6, bevelEnabled: true, bevelThickness: .25, bevelSize: .18, bevelSegments: 2 });
    geo.center();
    var dark = new THREE.MeshBasicMaterial({ color: 0x1b1030 });
    function mk(col) {
      var g = new THREE.Group(), z = .58;
      g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: .45, metalness: .1 })));
      g.userData.eyes = []; g.userData.blush = [];
      [-1, 1].forEach(function (s) {
        var e = new THREE.Mesh(new THREE.SphereGeometry(.13, 12, 12), dark);
        e.position.set(s * .5, .3, z); e.scale.z = .5; g.add(e); g.userData.eyes.push(e);
        var b = new THREE.Mesh(new THREE.CircleGeometry(.2, 16), new THREE.MeshBasicMaterial({ color: 0xff6f9c, transparent: true, opacity: .8 }));
        b.position.set(s * .9, .1, z); b.scale.y = .6; g.add(b); g.userData.blush.push(b);
      });
      var mo = new THREE.Mesh(new THREE.TorusGeometry(.12, .025, 6, 14, Math.PI), dark);
      mo.rotation.z = Math.PI; mo.position.set(0, .2, z); g.add(mo);
      g.scale.setScalar(.85); world.add(g); return g;
    }
    var A = mk(0x5ac8ff), B = mk(0xff7fa8);

    // floating hearts
    var cn = document.createElement('canvas'); cn.width = cn.height = 64;
    var c2 = cn.getContext('2d'); c2.fillStyle = '#fff'; c2.beginPath();
    for (i = 0; i <= 40; i++) {
      t = i / 40 * Math.PI * 2;
      var px = 32 + 25.6 * Math.pow(Math.sin(t), 3), py = 30 - 1.6 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      i ? c2.lineTo(px, py) : c2.moveTo(px, py);
    }
    c2.fill();
    var NP = 120, pos = new Float32Array(NP * 3), col = new Float32Array(NP * 3), spd = [], pal = [[1, .5, .68], [.5, .95, 1], [.7, .6, 1], [1, 1, 1]];
    for (i = 0; i < NP; i++) {
      pos.set([(Math.random() - .5) * 18, (Math.random() - .5) * 14, Math.random() * 7 - 4], i * 3);
      col.set(pal[i % 4], i * 3); spd.push(.4 + Math.random() * .9);
    }
    var pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); pg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    sc.add(new THREE.Points(pg, new THREE.PointsMaterial({ size: .55, map: new THREE.CanvasTexture(cn), vertexColors: true, transparent: true, depthWrite: false, opacity: .8 })));

    var gt = document.createElement('canvas'); gt.width = gt.height = 32;
    var g2 = gt.getContext('2d'), gr = g2.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g2.fillStyle = gr; g2.fillRect(0, 0, 32, 32);
    var glow = new THREE.CanvasTexture(gt), add = THREE.AdditiveBlending;

    // distant twinkling stars
    var NS = 300, sa2 = new Float32Array(NS * 3);
    for (i = 0; i < NS; i++) {
      var r0 = 25 + Math.random() * 30, th = Math.random() * 6.283, ph = Math.acos(2 * Math.random() - 1);
      sa2.set([r0 * Math.sin(ph) * Math.cos(th), r0 * Math.cos(ph), r0 * Math.sin(ph) * Math.sin(th)], i * 3);
    }
    var sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sa2, 3));
    var stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: .7, map: glow, color: 0xbfe9ff, transparent: true, depthWrite: false, blending: add }));
    sc.add(stars);

    // spinning geometric halos
    var rings = [[6, 5, 0x7df9ff], [3, 6.5, 0xa482ff], [4, 8, 0xff8fb1]].map(function (c) {
      var pts = [];
      for (var j = 0; j < c[0]; j++) { var a = j / c[0] * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * c[1], Math.sin(a) * c[1], 0)); }
      var r = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: c[2], transparent: true, opacity: .4 }));
      world.add(r); return r;
    });

    // giant heart made of 1800 glowing particles that swirl in from space
    var NH = 1800, SRC = new Float32Array(NH * 3), TGT = new Float32Array(NH * 3), hcol = new Float32Array(NH * 3), hpa = new Float32Array(NH * 3), dly = [], G = 2.3;
    for (i = 0; i < NH; i++) {
      var tt = Math.random() * Math.PI * 2, f = Math.pow(Math.random(), .35);
      var tx = 1.6 * Math.pow(Math.sin(tt), 3) * f * G;
      var ty = ((13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt)) / 10 * f + .3) * G;
      var tz = (Math.random() - .5) * 1.1 * Math.sqrt(Math.max(0, 1 - f * f * .5)) * G;
      TGT.set([tx, ty, tz], i * 3);
      var rr = 7 + Math.random() * 7, t2 = Math.random() * 6.283, p2 = Math.acos(2 * Math.random() - 1);
      SRC.set([rr * Math.sin(p2) * Math.cos(t2), rr * Math.cos(p2), rr * Math.sin(p2) * Math.sin(t2)], i * 3);
      var cc = new THREE.Color().setHSL(.5 + (tx / (1.6 * G) * .5 + .5) * .44, .9, .65); hcol.set([cc.r, cc.g, cc.b], i * 3);
      dly.push(Math.random() * .6);
    }
    var hg = new THREE.BufferGeometry();
    hg.setAttribute('position', new THREE.BufferAttribute(hpa, 3)); hg.setAttribute('color', new THREE.BufferAttribute(hcol, 3));
    var hpts = new THREE.Points(hg, new THREE.PointsMaterial({ size: .2, map: glow, vertexColors: true, transparent: true, opacity: 0, depthWrite: false, blending: add }));
    hpts.frustumCulled = false; world.add(hpts);

    var mx = 0, my = 0, mxs = 0, mys = 0;
    addEventListener('pointermove', function (e) { mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1; });
    var tp = 0, sp = 0, last = performance.now(), cur = -1;
    story.addEventListener('scroll', function () { tp = story.scrollTop / (story.scrollHeight - story.clientHeight); });

    function loop(now) {
      var dt = Math.min(.05, (now - last) / 1000), T = now / 1000; last = now;
      sp += (tp - sp) * Math.min(1, dt * 5);
      var p = sp, k = sm(p / .7), m = sm((p - .7) / .2), burst = sm((p - .68) / .15), d = (1.75 + 2.7 * (1 - k)) * (1 - m) + .55 * m;
      var zs = 1.3 * (1 - k) * Math.sin(p * 16 + .5), lean = .25 * sm((p - .65) / .25), hop = Math.abs(Math.sin(T * 3)) * .15 * k;
      A.position.set(-d, .15 * Math.sin(T * 2) + .5 * (1 - k) * Math.sin(p * 9) + hop, zs);
      B.position.set(d, .15 * Math.sin(T * 2 + 1.5) - .5 * (1 - k) * Math.sin(p * 9) + hop, -zs);
      A.rotation.y = .35 * Math.sin(T * 1.3) + .3 * (1 - k); B.rotation.y = -.35 * Math.sin(T * 1.3 + 1) - .3 * (1 - k);
      A.rotation.z = -lean + .06 * Math.sin(T * 2.2); B.rotation.z = lean + .06 * Math.sin(T * 2.2 + 1);
      var sc2 = (.85 * (1 - m) + .3 * m) * (1 + .05 * Math.sin(T * 6) * burst); A.scale.setScalar(sc2); B.scale.setScalar(sc2);
      var bl = (T % 3.2) < .12 ? .1 : 1;
      [A, B].forEach(function (h) {
        h.userData.eyes.forEach(function (e) { e.scale.y = bl; });
        h.userData.blush.forEach(function (b) { b.scale.x = 1 + .7 * p; });
      });
      var pa = pg.attributes.position.array;
      for (var j = 0; j < NP; j++) {
        pa[j * 3 + 1] += dt * (.25 + burst * 2.2) * spd[j];
        pa[j * 3] += Math.sin(T + j) * dt * .15;
        if (pa[j * 3 + 1] > 7) pa[j * 3 + 1] = -7;
      }
      pg.attributes.position.needsUpdate = true;
      mxs += (mx - mxs) * .05; mys += (my - mys) * .05;
      cam.position.set(Math.sin(p * 3) * 1.2 + mxs * 1.5, .4 + (1 - k) * .8 - mys, camZ * (1.15 - .2 * k + .3 * m)); cam.lookAt(0, .2, 0);
      stars.rotation.y = p * .9 + T * .01;
      rings.forEach(function (r, n) {
        r.rotation.z = T * (.15 + n * .08) * (n % 2 ? -1 : 1); r.rotation.x = p * 2 + n;
        r.scale.setScalar(1 + p * (.6 + n * .3)); r.material.opacity = .4 * (1 - m);
      });
      var mo = sm((p - .68) / .24), beat = 1 + .035 * Math.sin(T * 6) * mo;
      for (var q = 0; q < NH; q++) {
        var mi = sm((mo * 1.6 - dly[q]) / .6), a = (1 - mi) * 2.5, ca = Math.cos(a), sa = Math.sin(a), q3 = q * 3;
        var X = SRC[q3] + (TGT[q3] - SRC[q3]) * mi, Y = SRC[q3 + 1] + (TGT[q3 + 1] - SRC[q3 + 1]) * mi, Z = SRC[q3 + 2] + (TGT[q3 + 2] - SRC[q3 + 2]) * mi;
        hpa[q3] = (X * ca + Z * sa) * beat; hpa[q3 + 1] = Y * beat; hpa[q3 + 2] = (-X * sa + Z * ca) * beat;
      }
      hg.attributes.position.needsUpdate = true; hpts.material.opacity = Math.min(1, mo * 3);
      R.render(sc, cam);

      var c = Math.min(6, Math.floor(p * 7)), u = p * 7 - c;
      if (c !== cur) { cur = c; chap.textContent = L[c]; }
      chap.style.opacity = c === 6 ? Math.min(1, u * 5) : Math.min(1, u * 5, (1 - u) * 5);
      hint.style.opacity = p < .03 ? 1 : 0;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
